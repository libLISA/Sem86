[package]
name = "android-bridge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = [ "cdylib" ]
name = "android_bridge"

[dependencies]
android_logger = "0.15.1"
jni = "0.21.1"
log = "0.4.29"
pollster = "0.4.0"
raw-window-handle = "0.6.2"
wgpu = "27.0.1"
winit = { version = "0.30.12", features = ["android-native-activity"] }
sem86-core = { path = "../sem86-core/" }
sem86-video = { path = "../sem86-video/" }
sem86-arch = { path = "../sem86-arch/" }
lz4_flex = { git = "https://github.com/jxors/lz4_flex", branch = "snapshot", version = "0.12", features = ["frame"], default-features = false }
pot = "3.0.1"
liblisa = { path = "../liblisa", default-features = false }
generativity = "1.1.0"
ndk-context = "0.1.1"
nix = { version = "0.30.1", features = ["fs"] }

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9.0", features = ["api-level-28"] }
android-activity = { version = "0.6.0", features = ["native-activity"] }
ndk-sys = { version = "0.6.0" }
custom-llvm-build = { path = "../custom-llvm-build" }