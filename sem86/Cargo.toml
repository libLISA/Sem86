[package]
name = "sem86"
version = "0.1.0"
edition = "2024"

[dependencies]
cfg-if = "1"
anyhow = "1.0"
bytemuck = { version = "1.16", features = [ "derive" ] }
env_logger = "0.11.3"
sem86-arch = { path = "../sem86-arch/" }
log = "0.4"
pollster = "0.3"
wgpu = "27.0.1"
winit = { version = "0.30", features = ["rwh_06"] }
liblisa = { path = "../liblisa", default-features = false }
clap = { version = "4.5.23", features = ["derive"] }
sem86-core = { path = "../sem86-core" }
sem86-video = { path = "../sem86-video" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
rfd = "0.15.2"
fatfs = { version = "0.3.4", default-features = false, features = [
    "std",
    "alloc",
] }
mbrs = "0.3.1"
bilge = "0.2.0"
notify = "8.0.0"
pot = "3.0.1"
flate2 = "1.0.35"
lz4_flex = { git = "https://github.com/jxors/lz4_flex", branch = "snapshot", version = "0.12", features = ["frame"], default-features = false }
image = "0.25.6"
generativity = "1.1.0"
