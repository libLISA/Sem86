[workspace]
members = [
    "android-bridge",
    "bisect",
    "custom-llvm-build",
    "liblisa",
    "sem86-core",
    "sem86-arch",
    "sem86-video",
    "sem86",
    "semgen",
    "softfloat",
]
resolver = "2"

[profile.dev.package.'*']
opt-level = 3

[profile.dev]
opt-level = 2

[profile.release]
# lto = "fat"
codegen-units = 1
debug = "line-tables-only"