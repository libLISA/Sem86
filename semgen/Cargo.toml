[package]
name = "semgen"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.21"
env_logger = "0.11.3"
clap = { version = "4.5.23", features = ["derive"] }
itertools = "0.14.0"
serde = { version = "1.0.217", features = ["derive"] }
sem86-core = { path = "../sem86-core" }
liblisa = { path = "../liblisa", default-features = false }
pot = "3.0.1"
bitcode = "0.6.9"
flate2 = "1.0.35"
lz4_flex = { git = "https://github.com/jxors/lz4_flex", branch = "snapshot", version = "0.12", features = ["frame"], default-features = false }
rayon = "1.10.0"
rand = "0.9"
sem86-arch = { path = "../sem86-arch/" }
serde_json = "1.0.145"
xmas-elf = { git = 'https://github.com/jxors/xmas-elf', branch = "relr-support" }
arrayvec = "0.7.6"